<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jogo do Joca - Aprender a ler</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tv-focus.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h1>📖 Jogo do Joca</h1>
        <div class="fase-info">
            <span>Fase: <span id="nivel">1</span></span>
            <span>⭐ Acertos: <span id="pontos">0</span></span>
        </div>
        <div class="palavras-grid" id="palavrasGrid">
            <!-- As palavras serão inseridas via JS -->
        </div>
        <div class="mensagem" id="mensagem"></div>
        <button id="btnProximaFase" class="btn-proxima" style="display:none;">✨ Próxima Fase ✨</button>
    </div>
    <div id="worldSelection" class="world-selection">
    <h2>Escolha um Mundo</h2>
    <div id="worldsContainer" class="worlds-grid"></div>
</div>
<div id="gameArea" style="display:none;">
    <!-- conteudo anterior do jogo -->
    <div class="inimigo-area">
        <img id="inimigoImg" src="" alt="Inimigo" width="100">
    </div>
    <!-- resto igual -->
</div>

    <audio id="somAcerto" src="assets/sounds/correct.wav" preload="auto"></audio>
    <audio id="somErro" src="assets/sounds/wrong.wav" preload="auto"></audio>

    <script src="js/utils.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/game.js"></script>
    <script src="js/focus-navigation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
