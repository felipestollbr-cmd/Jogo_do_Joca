<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jogo do Joca - Aprender a ler</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tv-focus.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- TELA DE SELEÇÃO DE MUNDOS -->
    <div id="worldSelection" class="world-selection">
        <div class="container">
            <h1>📖 Jogo do Joca</h1>
            <h2>Escolha um Mundo</h2>
            <div id="worldsContainer" class="worlds-grid"></div>
        </div>
    </div>

    <!-- ÁREA PRINCIPAL DO JOGO -->
    <div id="gameArea" style="display: none;">
        <div class="container">
            <h1>📖 Jogo do Joca</h1>
            <div class="inimigo-area">
                <img id="inimigoImg" src="" alt="Inimigo" width="100">
            </div>
            <div class="fase-info">
                <span>Fase: <span id="nivel">1</span></span>
                <span>⭐ Acertos: <span id="pontos">0</span></span>
            </div>
            <div class="palavras-grid" id="palavrasGrid">
                <!-- As palavras serão inseridas via JS -->
            </div>
            <div class="mensagem" id="mensagem"></div>
            <button id="btnProximaFase" class="btn-proxima" style="display: none;">✨ Próxima Fase ✨</button>
        </div>
    </div>

    <!-- NÃO PRECISA MAIS DE <audio> -->

    <script src="js/utils.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/worlds.js"></script>
    <script src="js/game.js"></script>
    <script src="js/focus-navigation.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
